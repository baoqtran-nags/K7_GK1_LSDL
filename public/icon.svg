<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#312e81" />
      <stop offset="50%" stop-color="#4338ca" />
      <stop offset="100%" stop-color="#1e1b4b" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fde047" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background rounded squircle -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />

  <!-- Outer orbital ring -->
  <circle cx="256" cy="256" r="172" fill="none" stroke="url(#goldGrad)" stroke-width="8" stroke-dasharray="12 8" opacity="0.8" />

  <!-- Globe base circle -->
  <circle cx="256" cy="256" r="150" fill="#0f172a" stroke="#6366f1" stroke-width="4" />

  <!-- Latitude lines -->
  <ellipse cx="256" cy="256" rx="150" ry="70" fill="none" stroke="#38bdf8" stroke-width="3" opacity="0.5" />
  <line x1="106" y1="256" x2="406" y2="256" stroke="#38bdf8" stroke-width="3.5" opacity="0.6" />

  <!-- Longitude meridian -->
  <ellipse cx="256" cy="256" rx="80" ry="150" fill="none" stroke="#38bdf8" stroke-width="3" opacity="0.5" />
  <line x1="256" y1="106" x2="256" y2="406" stroke="#38bdf8" stroke-width="3" opacity="0.6" />

  <!-- Stylized European Continent Accent -->
  <path d="M 210 180 Q 230 160 260 170 Q 290 180 320 200 Q 300 230 270 240 Q 230 235 220 210 Z" fill="#10b981" opacity="0.9" />
  <path d="M 195 230 Q 210 215 225 230 Q 215 250 195 245 Z" fill="#10b981" opacity="0.85" />

  <!-- Compass Star / Graduation Crown -->
  <g transform="translate(256, 256)" filter="url(#glow)">
    <polygon points="0,-48 11,-12 48,0 11,12 0,48 -11,12 -48,0 -11,-12" fill="url(#goldGrad)" />
    <circle cx="0" cy="0" r="9" fill="#ffffff" />
  </g>

  <!-- Number 7 badge in bottom right corner -->
  <g transform="translate(372, 372)">
    <circle cx="0" cy="0" r="42" fill="url(#goldGrad)" stroke="#ffffff" stroke-width="4" />
    <text x="0" y="16" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="44" font-weight="800" text-anchor="middle" fill="#1e1b4b">7</text>
  </g>
</svg>
